name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Install pinned YARA-X for filescan integration tests
        run: bash .github/scripts/install-yara-x.sh
      - name: Validate and test release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          FILESCAN_REQUIRE_YR: '1'
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
      - name: Build static binaries and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="wpreset_${RELEASE_TAG}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            suffix=""
            if [ "$goos" = windows ]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "$stage/wpreset$suffix" .
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "$stage/dbscan$suffix" ./cmd/dbscan
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "$stage/filescan$suffix" ./cmd/filescan
            cp README.md DBSCAN.md FILESCAN.md "$stage/"
            cp cmd/filescan/rules/LICENSE "$stage/FILESCAN-RULES-LICENSE.txt"
            cp cmd/filescan/rules/README.md "$stage/FILESCAN-RULES.md"
            files=("wpreset$suffix" "dbscan$suffix" "filescan$suffix" README.md DBSCAN.md FILESCAN.md FILESCAN-RULES-LICENSE.txt FILESCAN-RULES.md)
            expected="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
            if [ "$goos" = windows ]; then
              archive="$GITHUB_WORKSPACE/dist/$name.zip"
              (cd "$stage" && zip -q "$archive" "${files[@]}")
              actual="$(zipinfo -1 "$archive" | LC_ALL=C sort)"
            else
              archive="dist/$name.tar.gz"
              tar -czf "$archive" -C "$stage" "${files[@]}"
              actual="$(tar -tzf "$archive" | LC_ALL=C sort)"
            fi
            if [ "$actual" != "$expected" ]; then
              printf 'Unexpected contents in %s:\n%s\n' "$archive" "$actual" >&2
              exit 1
            fi
            rm -- "${files[@]/#/$stage/}"
            rmdir -- "$stage"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "wpreset, dbscan and filescan $RELEASE_TAG" --generate-notes "${prerelease[@]}"
