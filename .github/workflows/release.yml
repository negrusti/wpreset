name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Validate and test release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 ./...
      - name: Build static binaries and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="wpreset_${RELEASE_TAG}_${goos}_${goarch}"
            stage="$(mktemp -d)"
            suffix=""
            if [ "$goos" = windows ]; then suffix=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="-s -w -X main.version=$RELEASE_TAG" -o "$stage/wpreset$suffix" .
            cp README.md "$stage/README.md"
            if [ "$goos" = windows ]; then
              (cd "$stage" && zip -q "$GITHUB_WORKSPACE/dist/$name.zip" wpreset.exe README.md)
            else
              tar -czf "dist/$name.tar.gz" -C "$stage" wpreset README.md
            fi
            rm -rf "$stage"
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "wpreset $RELEASE_TAG" --generate-notes "${prerelease[@]}"
